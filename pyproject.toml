[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-cngov"
version = "1.0.0"
description = "Convert Telegram zh-Hans language packs to zh-Hant-CN (PRC-standard Traditional Chinese)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "soizo" }]
dependencies = ["PyYAML>=6.0"]

[project.scripts]
telegram-cngov = "telegram_cngov.__main__:main"

[tool.setuptools.packages.find]
include = ["telegram_cngov*"]
