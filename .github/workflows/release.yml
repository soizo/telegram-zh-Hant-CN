---
name: Update translations

"on":
  schedule:
    - cron: "0 3 1,6,11,16,21,26,31 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: translation-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install --editable .
      - name: Install OpenCC 1.4.2
        run: "python -m pip install --only-binary=:all: opencc==1.4.2"
      - name: Verify
        run: python -m unittest discover -s tests -v
      - name: Convert translations
        run: python -m telegram_cngov --output dist --metadata .work/build.json
      - name: Compare with latest release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python scripts/release.py prepare
          --dist dist
          --metadata .work/build.json
          --notes .work/release-notes.md
      - name: Publish changed translations
        if: steps.release.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          ARCHIVE: ${{ steps.release.outputs.archive }}
        run: >-
          gh release create "$TAG"
          dist/android.xml
          dist/android_x.xml
          dist/emoji.strings
          dist/ios.strings
          dist/macos.strings
          dist/tdesktop.strings
          dist/unigram.xml
          dist/weba.strings
          dist/webk.strings
          "dist/$ARCHIVE"
          dist/SHA256SUMS
          --title "$TAG"
          --notes-file .work/release-notes.md
